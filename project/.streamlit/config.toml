# The chart palette was validated against the light surface #fcfcfb only.
# Dark mode needs its own selected steps re-validated against the dark surface,
# so the app pins light rather than shipping an unvalidated inversion.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f4f3f0"
textColor = "#0b0b0b"
font = "sans-serif"

[server]
headless = true

[browser]
gatherUsageStats = false

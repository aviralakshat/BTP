# Render blueprint for the model API. The web console is hosted on Vercel
# (root directory project/web) with MODEL_API_URL set to this service's URL.
services:
  - type: web
    name: dri-kiln-api
    runtime: python
    plan: free
    rootDir: project
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.5
